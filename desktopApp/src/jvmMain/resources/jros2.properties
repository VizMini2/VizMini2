# jros2's settings for VizMini2 on the PC, the same as jros2's defaults. jros2 reads them from here (the app's jar)
# before ~/.ihmc/jros2.properties, so it does not create that file in the user's home folder (on Windows,
# %USERPROFILE%\.ihmc). The domain comes from VizMini2's own settings (each node is created with it), and
# Main.kt keeps jros2's intraprocess default on GitHub Actions.
jros2.ros.domain.id=0
jros2.fastdds.intraprocess.delivery=false
jros2.fastdds.interface.whitelist=
