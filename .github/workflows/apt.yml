#
# VizMini2's apt repository (tools/apt/update-repo.sh): when a VizMini2 release (v*) is published, its .deb goes into
# the repository, the assets of the "apt" release, and the index is signed again. By hand, for the tag you give (to
# fill it with a release published before this workflow existed, or to try it).
#
# Users add it once (the .deb does it by itself on its first install):
#   deb [arch=amd64 signed-by=/usr/share/keyrings/vizmini2-archive-keyring.gpg] https://github.com/VizMini2/VizMini2/releases/download/apt ./
#
# Needs the repository secret APT_SIGNING_KEY: the private signing key, armored and without a passphrase
# (`gpg --armor --export-secret-keys <id>`); its public half is desktopApp/packaging/linux/vizmini2-archive-keyring.gpg.
name: apt repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The VizMini2 release whose .deb goes into the repository (v1.0.0...)
        required: true

permissions:
  contents: read

# One update at a time: each one reads the index the previous one wrote.
concurrency:
  group: apt
  cancel-in-progress: false

jobs:
  apt:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    # Up to 100 minutes waiting for the release workflow's .deb, if the release was published before it finished.
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: apt-ftparchive
        # Not in every runner image (apt-utils).
        run: command -v apt-ftparchive > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils > /dev/null; }
      - name: Signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::The APT_SIGNING_KEY secret is missing (see the top of .github/workflows/apt.yml)."
            exit 1
          fi
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long
      - name: Wait for the release's .deb
        # A release published before release.yml has uploaded its files (it takes about an hour): wait for them
        # instead of failing.
        run: |
          for i in $(seq 1 100); do
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -q '_amd64\.deb$'; then
              exit 0
            fi
            [ "$i" -gt 1 ] || echo "No .deb in $TAG yet: waiting for the release workflow to upload it."
            sleep 60
          done
          echo "::error::$TAG still has no *_amd64.deb after 100 minutes (did the release workflow fail?)."
          exit 1
      - name: The release's .deb into the repository
        run: |
          gh release download "$TAG" -p '*_amd64.deb' -D debs
          ls -la debs
          bash tools/apt/update-repo.sh debs/*.deb
          echo "apt repository: $(ls debs) added and signed." >> "$GITHUB_STEP_SUMMARY"
