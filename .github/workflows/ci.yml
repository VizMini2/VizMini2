#
# Everything that can be checked without a real phone, on every push and pull request:
# - checks: license headers, English-only comments, and the desktop natives running on Ubuntu 20.04 (glibc 2.31);
# - jvm: unit tests of the shared core and of the Android app, Android lint, the desktop app compiles;
# - android: debug APKs (app + instrumented tests) as artifacts;
# - desktop: the Linux .deb and the app image as artifacts;
# - desktop-compat: the app image on clean Ubuntu 20.04, 22.04 and 24.04 (Fast DDS loads, Filament renders the 3D view);
# - docs: API reference (Dokka) and the user manual (Sphinx) as artifacts;
# - e2e-desktop: the desktop app's end-to-end tests against real ROS 2 servers (fake robot, Nav2, MoveIt, ros2_control,
#   H.264/H.265 video, map services) in a container of each ROS distro (Humble, Jazzy, Lyrical), with the app in that
#   same container, so both each distro's message versions and its Ubuntu are tested;
# - e2e-android: the device-only instrumented tests (with the in-app demo robot) on an Android emulator.
# Only "direct" debug variants: the "play" release tasks upload the mapping to Crashlytics and need the real keys.
# The release files (signed APKs, Play bundle, .deb, .tar.gz, manual) come from release.yml, on each "v*" tag.
name: CI

# Pushes and pull requests that only touch these files (texts for GitHub, not code or the manual) do not run it. The
# manual (docs/) does: the docs job builds it.
on:
  push:
    branches: [main, develop]
    paths-ignore: ["*.md", LICENSE, NOTICE, .github/ISSUE_TEMPLATE/**, .github/pull_request_template.md, .github/dependabot.yml]
  pull_request:
    paths-ignore: ["*.md", LICENSE, NOTICE, .github/ISSUE_TEMPLATE/**, .github/pull_request_template.md, .github/dependabot.yml]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: License headers
        run: python3 tools/license_headers.py --check
      - name: Comments in English
        run: python3 tools/check_english_comments.py
      - name: Desktop natives run on Ubuntu 20.04 or newer
        run: bash tools/compat/check-glibc.sh

  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint and desktop build
        # :desktopApp:jvmTest here runs the UI tests of the shared screens; its end-to-end tests skip themselves.
        run: ./gradlew --no-daemon :core:jvmTest testDirectDebugUnitTest lintDirectDebug :desktopApp:jvmTest
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            core/build/reports/
            app/build/reports/
            desktopApp/build/reports/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Debug APKs
        run: ./gradlew --no-daemon assembleDirectDebug assembleDirectDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: vizmini2-direct-debug
          path: |
            app/build/outputs/apk/direct/debug/*.apk
            app/build/outputs/apk/androidTest/direct/debug/*.apk
          retention-days: 7

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Linux package and app image
        run: |
          ./gradlew --no-daemon :desktopApp:packageDeb :desktopApp:createDistributable
          tar -C desktopApp/build/compose/binaries/main/app -cf vizmini2-app.tar vizmini2
      - uses: actions/upload-artifact@v7
        with:
          name: vizmini2-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: vizmini2-app
          path: vizmini2-app.tar
          retention-days: 3

  # The app image on Ubuntu releases older than the build machine's, with only a desktop's libraries.
  desktop-compat:
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vizmini2-app
      - name: Ubuntu ${{ matrix.ubuntu }}
        run: |
          docker run --rm -v "$PWD":/w -w /w ubuntu:${{ matrix.ubuntu }} bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends libx11-6 libxext6 libxrender1 libxtst6 libxi6 \
              libfreetype6 fontconfig fonts-dejavu-core libgl1 libgl1-mesa-dri libglx-mesa0 xvfb xauth > /dev/null
            tar xf vizmini2-app.tar
            ldd --version | head -1
            # Fast DDS: it connects (no robot here, so it exits with 1 after printing the status).
            vizmini2/bin/vizmini2 --check > check.log 2>&1 || true; cat check.log
            grep -q ": Connected" check.log
            ! grep -qi "failed to load fastddsjava" check.log
            # Filament and Compose: the 3D view renders.
            xvfb-run -a -s "-screen 0 1280x900x24" vizmini2/bin/vizmini2 --shot rviz.png --tab RVIZ --millis 6000
            test -s rviz.png'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-compat-${{ matrix.ubuntu }}
          path: |
            check.log
            rviz.png
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: API reference (Dokka)
        run: ./gradlew --no-daemon dokkaGenerate
      - name: User manual (Sphinx, English and Spanish)
        run: |
          python3 -m pip install --quiet sphinx sphinx-rtd-theme myst-parser
          bash docs/build.sh "$PWD/build/docs/manual"
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: |
            build/dokka/html/
            build/docs/manual/
          retention-days: 14

  # The ROS servers run in a container of each distro, and the app's tests in another one of the same distro (so on
  # its Ubuntu: 22.04 for Humble, 24.04 for Jazzy, 26.04 for Lyrical). Both are on the same Docker network, so DDS
  # discovery works between them.
  e2e-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        servers: [lyrical, jazzy, humble]
    steps:
      - uses: actions/checkout@v7
      - name: ROS servers (${{ matrix.servers }})
        run: |
          docker network create e2e
          docker run -d --name servers --network e2e -e ROS_DOMAIN_ID=77 -v "$PWD":/ws -w /ws ros:${{ matrix.servers }}-ros-base \
            bash tools/e2e/servers.sh
      - name: End-to-end tests (app on ${{ matrix.servers }}'s Ubuntu)
        run: |
          docker run --rm --network e2e -e VIZMINI2_E2E=1 -e VIZMINI2_E2E_DOMAIN=77 -v "$PWD":/ws -w /ws ros:${{ matrix.servers }}-ros-base bash -c '
            apt-get update -qq && apt-get install -y -qq openjdk-17-jdk-headless openjdk-21-jdk-headless ffmpeg libgl1 libfontconfig1 > /dev/null &&
            until grep -q "servers ready" build/e2e/servers.log 2>/dev/null; do sleep 2; done &&
            ./gradlew --no-daemon :desktopApp:jvmTest'
      - name: Server logs
        if: always()
        run: docker logs servers > build-e2e-servers.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-desktop-${{ matrix.servers }}
          path: |
            build-e2e-servers.log
            build/e2e/
            desktopApp/build/reports/tests/
          retention-days: 7

  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: APKs
        run: ./gradlew --no-daemon assembleDirectDebug assembleDirectDebugAndroidTest
      - name: Memory for the emulator
        # The emulator with a phone-sized screen and software rendering takes up to about 7 GB of the runner's 16 GB. The
        # Kotlin compile daemon outlives the build (with up to org.gradle.jvmargs' 6 GB), and with it the kernel's OOM
        # killer took the emulator down in the middle of the tests ("device offline"). Stop it and add swap as margin.
        run: |
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          sudo fallocate -l 8G /extra.swap && sudo chmod 600 /extra.swap && sudo mkswap /extra.swap > /dev/null && sudo swapon /extra.swap
          free -m
      - name: Disk space for the emulator
        # The runner's preinstalled toolchains this job does not use; without this the emulator's data partition
        # does not fit next to the Gradle build.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Device tests on an emulator (demo robot, no PC servers)
        id: device
        # The emulator (software rendering) sometimes crashes on its own, without running out of memory: then the classes
        # it did not get to run again on a new one (next step). Whether any class failed is decided at the end.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A phone-sized screen (the default AVD is 320x640, too small for the dashboard and drag tests).
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/e2e/android_device_tests.sh
      - name: Device tests not run, on a new emulator
        id: device_again
        if: steps.device.outcome == 'failure' && hashFiles('build/e2e-android/not_run.txt') != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ONLY="$(cat build/e2e-android/not_run.txt)" bash tools/e2e/android_device_tests.sh
      - name: Device test results
        run: |
          if [ -s build/e2e-android/failed.txt ]; then echo "Failed: $(sort -u build/e2e-android/failed.txt | tr '\n' ' ')"; exit 1; fi
          if [ -f build/e2e-android/not_run.txt ]; then echo "Not run (the emulator crashed twice): $(cat build/e2e-android/not_run.txt)"; exit 1; fi
          if [ "${{ steps.device.outcome }}" = failure ] && [ "${{ steps.device_again.outcome }}" != success ]; then echo "The device tests did not finish"; exit 1; fi
          echo "All device tests passed."
      - name: Memory and OOM killer
        if: failure()
        run: |
          free -m
          sudo dmesg -T | grep -iE "out of memory|oom-kill|killed process" || echo "No OOM kills in the kernel log."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-android
          # With the emulator's crash reports, if it crashed.
          path: |
            build/e2e-android/
            /tmp/android-runner/emu-crash-*
          retention-days: 7
