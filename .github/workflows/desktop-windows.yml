#
# The desktop app on Windows (work in progress), with the Windows natives already in the desktop jars
# (windows-natives.yml and tools/desktop-natives/add-windows.sh):
# - the desktop tests (the UI tests of the shared screens; the end-to-end ones skip themselves without ROS servers);
# - the .msi installer and the app folder, as an artifact to try by hand;
# - as desktop-compat does on Ubuntu (ci.yml): Fast DDS connects (--check) and Filament renders the 3D view (--shot), the
#   latter with Mesa's software OpenGL next to the app, since the runners have no GPU (their OpenGL is Windows' 1.1).
name: Desktop on Windows

on:
  pull_request:
    paths-ignore: ["*.md", LICENSE, NOTICE, .github/ISSUE_TEMPLATE/**, .github/pull_request_template.md, .github/dependabot.yml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP: desktopApp/build/compose/binaries/main/app/vizmini2
  MESA: "26.2.5"

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Desktop tests, the .msi and the app
        shell: bash
        run: ./gradlew --no-daemon :desktopApp:jvmTest :desktopApp:packageMsi :desktopApp:createDistributable
      - name: Fast DDS connects
        shell: bash
        run: |
          ls "$APP"
          # No robot here, so it exits with 1 after printing the status.
          "$APP/vizmini2.exe" --check > check.log 2>&1 || true
          cat check.log
          grep -q ": Connected" check.log
          ! grep -qi "failed to load fastddsjava" check.log
      - name: Filament renders the 3D view (Mesa's software OpenGL)
        shell: bash
        run: |
          curl -sSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA/mesa3d-$MESA-release-msvc.7z"
          7z x -y -omesa mesa.7z x64 > /dev/null
          ls mesa/x64
          # Next to the .exe, Windows loads these before its own opengl32.dll.
          for f in opengl32.dll libgallium_wgl.dll libglapi.dll; do [ -f "mesa/x64/$f" ] && cp "mesa/x64/$f" "$APP/"; done
          GALLIUM_DRIVER=llvmpipe "$APP/vizmini2.exe" --shot rviz.png --tab RVIZ --millis 8000 > shot.log 2>&1 || true
          cat shot.log
          test -s rviz.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/
            desktopApp/build/reports/
            check.log
            shot.log
            rviz.png
          retention-days: 14
