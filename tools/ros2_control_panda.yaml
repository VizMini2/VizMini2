# Controllers of tools/ros2_control_panda.launch.py (the Panda with mock hardware), to test the Controllers panel:
# one of each kind the panel drives (trajectory and forward command), and one that starts inactive.
# The "/**/" wildcards make the keys match with or without a namespace.
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    panda_arm_position_controller:
      type: forward_command_controller/ForwardCommandController
    panda_hand_controller:
      type: forward_command_controller/ForwardCommandController

/**/panda_arm_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
    allow_nonzero_velocity_at_trajectory_end: true

/**/panda_arm_position_controller:
  ros__parameters:
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
    interface_name: position

/**/panda_hand_controller:
  ros__parameters:
    joints: [panda_finger_joint1]
    interface_name: position
